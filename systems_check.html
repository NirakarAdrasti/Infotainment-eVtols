<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aircraft Systems Check - Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .control-panel {
      background: white;
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .control-panel h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-weight: 600;
      color: #333;
      font-size: 0.95em;
    }

    .control-group input {
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    .control-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-check {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      flex: 1;
      min-width: 120px;
    }

    .btn-check:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-reset {
      background: #f0f0f0;
      color: #333;
      border: 2px solid #ddd;
    }

    .btn-reset:hover {
      background: #e0e0e0;
    }

    .preset-buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-preset {
      padding: 10px 15px;
      border: 2px solid #ddd;
      background: white;
      color: #333;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9em;
      transition: all 0.3s;
    }

    .btn-preset:hover {
      border-color: #667eea;
      background: #f5f5ff;
    }

    .notifications {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .notifications h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    .notification-item {
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      border-left: 5px solid;
      display: flex;
      align-items: flex-start;
      gap: 15px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .notification-item.success {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    .notification-item.error {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }

    .notification-icon {
      font-size: 1.5em;
      min-width: 30px;
    }

    .notification-content {
      flex: 1;
    }

    .notification-title {
      font-weight: 600;
      font-size: 1.1em;
      margin-bottom: 5px;
    }

    .notification-message {
      font-size: 0.95em;
      opacity: 0.9;
    }

    .flight-status {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 1.3em;
      font-weight: 600;
      animation: pulse 2s infinite;
    }

    .flight-status.approved {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
    }

    .flight-status.denied {
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      color: white;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .status-badge {
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      font-size: 0.9em;
    }

    .status-badge.ok {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .status-badge.fail {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .empty-state p {
      font-size: 1.1em;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8em;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .control-panel,
      .notifications {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✈️ Aircraft Systems Check</h1>
      <p>Pre-Flight Health Verification System</p>
    </div>

    <div class="control-panel">
      <h2>System Status Input (1 = OK, 0 = Failed)</h2>

      <div class="controls">
        <div class="control-group">
          <label for="engine">Engine</label>
          <input type="number" id="engine" min="0" max="1" value="1" placeholder="0 or 1">
        </div>

        <div class="control-group">
          <label for="propeller1">Propeller 1</label>
          <input type="number" id="propeller1" min="0" max="1" value="1" placeholder="0 or 1">
        </div>

        <div class="control-group">
          <label for="propeller2">Propeller 2</label>
          <input type="number" id="propeller2" min="0" max="1" value="1" placeholder="0 or 1">
        </div>

        <div class="control-group">
          <label for="turbulence">Turbulence</label>
          <input type="number" id="turbulence" min="0" max="1" value="1" placeholder="0 or 1">
        </div>

        <div class="control-group">
          <label for="weather">Weather</label>
          <input type="number" id="weather" min="0" max="1" value="1" placeholder="0 or 1">
        </div>
      </div>

      <div class="button-group">
        <button class="btn-check" onclick="checkSystems()">🔍 Check Systems</button>
        <button class="btn-reset" onclick="resetForm()">🔄 Reset</button>
      </div>

      <div class="preset-buttons">
        <button class="btn-preset" onclick="setPreset(1, 1, 1, 1, 1)">✓ All Systems OK</button>
        <button class="btn-preset" onclick="setPreset(0, 1, 1, 1, 1)">✗ Engine Failure</button>
        <button class="btn-preset" onclick="setPreset(1, 0, 0, 1, 1)">✗ Propeller Issues</button>
        <button class="btn-preset" onclick="setPreset(1, 1, 1, 0, 0)">✗ Weather Alert</button>
      </div>
    </div>

    <div class="notifications">
      <h2>📋 System Status Report</h2>
      <div id="notificationArea">
        <div class="empty-state">
          <p>👆 Enter system values and click "Check Systems" to generate report</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function checkSystems() {
      const engine = parseInt(document.getElementById('engine').value) || 0;
      const propeller1 = parseInt(document.getElementById('propeller1').value) || 0;
      const propeller2 = parseInt(document.getElementById('propeller2').value) || 0;
      const turbulence = parseInt(document.getElementById('turbulence').value) || 0;
      const weather = parseInt(document.getElementById('weather').value) || 0;

      // Validate inputs
      if (![0, 1].includes(engine) || ![0, 1].includes(propeller1) || ![0, 1].includes(propeller2) || 
          ![0, 1].includes(turbulence) || ![0, 1].includes(weather)) {
        alert('Please enter only 0 or 1 for each system');
        return;
      }

      // Generate report
      const report = generateReport(engine, propeller1, propeller2, turbulence, weather);
      displayReport(report);
    }

    function generateReport(engine, prop1, prop2, turbulence, weather) {
      const systems = {
        engine: checkEngine(engine),
        propeller1: checkPropeller1(prop1),
        propeller2: checkPropeller2(prop2),
        turbulence: checkTurbulence(turbulence),
        weather: checkWeather(weather)
      };

      systems.flightStatus = getFlightClearance(engine, prop1, prop2, turbulence, weather);
      return systems;
    }

    function checkEngine(status) {
      if (status === 1) {
        return {
          component: 'Engine',
          message: '✓ Engine running smoothly at 1200 RPM',
          icon: '🟢',
          severity: 'success'
        };
      }
      return {
        component: 'Engine',
        message: '✗ Engine failure detected - CANNOT FLY',
        icon: '🔴',
        severity: 'error'
      };
    }

    function checkPropeller1(status) {
      if (status === 1) {
        return {
          component: 'Propeller 1',
          message: '✓ Propeller 1 operational at optimal RPM',
          icon: '🟢',
          severity: 'success'
        };
      }
      return {
        component: 'Propeller 1',
        message: '✗ Propeller 1 malfunction - CANNOT FLY',
        icon: '🔴',
        severity: 'error'
      };
    }

    function checkPropeller2(status) {
      if (status === 1) {
        return {
          component: 'Propeller 2',
          message: '✓ Propeller 2 operational at optimal RPM',
          icon: '🟢',
          severity: 'success'
        };
      }
      return {
        component: 'Propeller 2',
        message: '✗ Propeller 2 malfunction - CANNOT FLY',
        icon: '🔴',
        severity: 'error'
      };
    }

    function checkTurbulence(status) {
      if (status === 1) {
        return {
          component: 'Turbulence',
          message: '✓ Atmospheric conditions stable - Turbulence within limits',
          icon: '🟢',
          severity: 'success'
        };
      }
      return {
        component: 'Turbulence',
        message: '✗ Severe turbulence detected - CANNOT FLY',
        icon: '🔴',
        severity: 'error'
      };
    }

    function checkWeather(status) {
      if (status === 1) {
        return {
          component: 'Weather',
          message: '✓ Weather conditions suitable for flight',
          icon: '🟢',
          severity: 'success'
        };
      }
      return {
        component: 'Weather',
        message: '✗ Hazardous weather detected - CANNOT FLY',
        icon: '🔴',
        severity: 'error'
      };
    }

    function getFlightClearance(engine, prop1, prop2, turbulence, weather) {
      const allOk = engine === 1 && prop1 === 1 && prop2 === 1 && turbulence === 1 && weather === 1;

      if (allOk) {
        return {
          message: '✈️ ALL SYSTEMS OPERATIONAL - READY FOR FLIGHT',
          icon: '✈️',
          status: 'approved'
        };
      }

      const failed = [];
      if (engine === 0) failed.push('ENGINE');
      if (prop1 === 0) failed.push('PROPELLER 1');
      if (prop2 === 0) failed.push('PROPELLER 2');
      if (turbulence === 0) failed.push('TURBULENCE');
      if (weather === 0) failed.push('WEATHER');

      return {
        message: `⛔ FLIGHT DENIED - Critical systems failed: ${failed.join(', ')}`,
        icon: '⛔',
        status: 'denied'
      };
    }

    function displayReport(report) {
      const area = document.getElementById('notificationArea');
      let html = '';

      // Add system notifications
      for (let [key, system] of Object.entries(report)) {
        if (key !== 'flightStatus') {
          html += `
            <div class="notification-item ${system.severity}">
              <div class="notification-icon">${system.icon}</div>
              <div class="notification-content">
                <div class="notification-title">${system.component}</div>
                <div class="notification-message">${system.message}</div>
              </div>
            </div>
          `;
        }
      }

      // Add flight status
      const flightStatus = report.flightStatus;
      html += `
        <div class="flight-status ${flightStatus.status}">
          ${flightStatus.icon} ${flightStatus.message}
        </div>
      `;

      area.innerHTML = html;
    }

    function resetForm() {
      document.getElementById('engine').value = 1;
      document.getElementById('propeller1').value = 1;
      document.getElementById('propeller2').value = 1;
      document.getElementById('turbulence').value = 1;
      document.getElementById('weather').value = 1;
      document.getElementById('notificationArea').innerHTML = `
        <div class="empty-state">
          <p>👆 Enter system values and click "Check Systems" to generate report</p>
        </div>
      `;
    }

    function setPreset(engine, prop1, prop2, turbulence, weather) {
      document.getElementById('engine').value = engine;
      document.getElementById('propeller1').value = prop1;
      document.getElementById('propeller2').value = prop2;
      document.getElementById('turbulence').value = turbulence;
      document.getElementById('weather').value = weather;
      checkSystems();
    }

    // Auto-check on page load
    window.addEventListener('load', () => {
      checkSystems();
    });
  </script>
</body>
</html>
